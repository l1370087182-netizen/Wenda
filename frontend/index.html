<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="闻达 · 六类资讯日报 —— 多 Agent 采集分析，每日一封，深度问答" />
  <title>闻达 · 六类资讯日报</title>
  <style>
    /* 首屏加载动画（Vue 挂载前） */
    #boot { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
             background: #f5f6f8; font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
    html[data-theme="dark"] #boot { background: #0f1117; }
    #boot .ring { width: 36px; height: 36px; border-radius: 50%; border: 3px solid #dcdfe8;
                  border-top-color: #4f46e5; animation: bootspin 0.8s linear infinite; }
    @keyframes bootspin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="app"><div id="boot"><div class="ring"></div></div></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
